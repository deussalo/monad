<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>cogs</title>
<style>
/*@include base.css*/
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:12px/1.3 var(--rig-font-mono,ui-monospace,Menlo,Consolas,monospace);
  overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#safe{position:fixed;left:0;top:0;width:0;height:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);pointer-events:none}
#dev{position:fixed;left:0;right:0;bottom:0;top:max(28vh,calc(env(safe-area-inset-top,0px) + 120px));z-index:10;overflow-y:auto;transition:transform .28s cubic-bezier(.16,1,.3,1);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);touch-action:pan-y;-webkit-user-select:text;user-select:text}
#scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35)}
#dev input[type=range]{touch-action:none}
#dev[hidden],#scrim[hidden]{display:none}
#panel{max-width:440px;margin:0 auto;padding:6px}
#part-bar{position:fixed;left:var(--space-2,8px);display:flex;gap:var(--space-2,8px)}
#clip-bar{position:fixed;left:var(--space-2,8px);display:flex;gap:var(--space-2,8px)}
#copy-parts[hidden],#paste-parts[hidden]{display:none}
#history{position:fixed;left:50%;transform:translateX(-50%);display:flex;gap:var(--space-2,8px)}
#history[hidden]{display:none}
#history button:disabled{opacity:.3}
#part-bar button,#to-start,#history button,#clip-bar button,#editor-head button{min-height:44px;min-width:44px;padding:0;border:0;background:none;display:grid;place-items:center;color:var(--fg)}
#to-start{position:fixed;right:62px}
#edit-part[hidden],#delete-part[hidden],#to-start[hidden],#editor-head{display:none}
/* The sheet's top: a grab bar and, for an editor, its head. Drag it down to tuck the sheet away to just this strip,
   up or tap to bring it back; drag down again from the strip to close. */
#sheet-top{position:sticky;top:0;z-index:1;background:var(--bg);touch-action:none;cursor:grab}
#grab{height:28px;display:grid;place-items:center}
#grab::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--dim)}
#dev.min{transform:translateY(calc(100% - var(--peek,80px)));overflow:hidden}
#dev.min #grab::before{background:var(--hot)}
#dev.dragging{transition:none}
body.sheet-min #interaction{bottom:var(--peek,80px);border-bottom:1px solid var(--line)}
#dev[data-editor]:not([data-editor=""]){top:max(14vh,env(safe-area-inset-top,0px));border-radius:var(--space-3,12px) var(--space-3,12px) 0 0}
#dev[data-editor]:not([data-editor=""]) #editor-head{display:flex;align-items:center;gap:var(--space-2,8px);padding:0 var(--space-2,8px) var(--space-2,8px)}
#editor-title{flex:1;color:var(--hot)}
#dev[data-editor]:not([data-editor=""]) #panel{max-width:none;padding:var(--space-2,8px)}
#dev[data-editor]:not([data-editor=""]) button,#dev[data-editor]:not([data-editor=""]) .row,#dev[data-editor]:not([data-editor=""]) input[type=number],#dev[data-editor]:not([data-editor=""]) select{min-height:44px}
#dev[data-editor]:not([data-editor=""]) #panel>fieldset:not(#inspector),#dev[data-editor]:not([data-editor=""]) #inspector>legend{display:none}
#dev[data-editor]:not([data-editor=""]) #inspector>:is([data-k="x"],[data-k="y"],[data-k="radius"]),
#dev[data-editor="patch"] #inspector>:is([data-k="x1"],[data-k="y1"],[data-k="x2"],[data-k="y2"]),
#dev[data-editor="notes"] #inspector>:is([data-k="teeth"],[data-k="rpm"],[data-k="revs/bar"],[data-k="layer"],[data-k="phase deg"],.ro){display:none}
.roll-sel{display:flex;justify-content:flex-end;gap:var(--space-1,4px)}
#dev .roll-sel button{min-width:44px;min-height:44px;padding:0;border:0;background:none;display:grid;place-items:center;color:var(--fg)}
#dev[data-editor="notes"] #editor-title{display:none}
#editor-head .roll-sel{flex:1;min-width:0;gap:0}
#dev #editor-head button{min-width:0;flex:0 1 44px}
#dev .roll-sel .roll-snap{-webkit-appearance:none;appearance:none;width:auto;min-width:52px;margin-right:auto;padding:0 6px;border:0;background:none;color:var(--hot);font-size:15px;text-align:center}
#dev[data-editor="notes"] #inspector>button{background:var(--pad);border-radius:8px;padding:0 14px;margin:2px 4px 2px 0}
/* Pickers in the editors (voice kind, note, octave…) as compact chips that sit side by side, not full-width rows. */
#dev[data-editor]:not([data-editor=""]) #inspector>.row:has(>select){display:inline-flex;flex-direction:column;align-items:stretch;gap:2px;min-width:76px;margin:0 6px 8px 0;vertical-align:top;min-height:0}
#dev[data-editor]:not([data-editor=""]) #inspector>.row:has(>select)>span:first-child{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
#dev[data-editor]:not([data-editor=""]) #inspector>.row:has(>select)>span:empty{display:none}
#dev[data-editor]:not([data-editor=""]) #inspector>.row>select{-webkit-appearance:none;appearance:none;background:var(--pad);border-radius:8px;padding:0 12px;min-height:40px;text-align:center}
/* The disc's tuning: compact chips that wrap, a small label over each value. */
.disc-fields{display:flex;flex-wrap:wrap;gap:var(--space-2,8px);margin:var(--space-2,8px) 0}
#dev .disc-fields .row{display:flex;flex-direction:column;align-items:stretch;gap:2px;margin:0;min-height:0;flex:1 1 auto}
.disc-fields .row>span:first-child{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.disc-fields .row>span:empty{display:none}
#dev .disc-fields select,#dev .disc-fields input[type=number]{-webkit-appearance:none;appearance:none;-moz-appearance:textfield;background:var(--pad);border-radius:8px;padding:0 12px;min-height:40px;text-align:center}
.disc-fields input[type=number]::-webkit-inner-spin-button,.disc-fields input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.disc-fields .stepper{display:flex;align-items:center;gap:2px}
#dev .disc-fields .stepper input{width:48px;padding:0}
#dev .disc-fields .stepper button{min-width:40px;min-height:40px;background:var(--pad);border-radius:8px;font-size:18px}
/* the synth's patch sheet: pitch chips on one row, level and vel sense side by side on the next, no pitch readout
   (the keyboard says the shift) and the routing hint only while a source is armed, so the synth itself is on screen */
#dev[data-editor="patch"] #inspector:has(.wave)>.row:has(>input[type=range]):not(:is([data-k="x"],[data-k="y"],[data-k="radius"])){display:inline-flex;flex-wrap:wrap;align-items:center;column-gap:6px;width:calc(50% - 6px);margin:0 6px 2px 0;min-height:0;vertical-align:top}
#dev[data-editor="patch"] #inspector:has(.wave)>.row:has(>input[type=range])>span:first-child{flex:1 0 100%;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
#dev[data-editor="patch"] #inspector:has(.wave)>.row>input[type=range]{flex:1 1 0;min-width:0;min-height:36px}
#dev[data-editor="patch"] #inspector:has(.wave)>.row>input[type=number]{flex:0 0 44px;width:44px;min-height:36px;padding:0;text-align:center;background:none}
#dev[data-editor="patch"] #inspector:has(.wave)>.ro,#dev .wave div.wave-hint:not([data-armed]){display:none}
/* a synth row of choices (osc on, table, filter, warp, warp 2) stays one row: the choices share the width */
#dev .wave-row:has(>.wave-choice){flex-wrap:nowrap}
#dev .wave-row>.wave-choice{flex:1 1 0;min-width:0}
#dev .wave-row>.wave-choice select{width:100%;min-width:0;padding:0 4px;font-size:13px;text-overflow:ellipsis}
#dev .wave-row>button{flex:0 0 auto}
#dev .roll-sel button[aria-pressed=true]{color:var(--hot)}
#dev .roll-sel button:disabled{color:var(--faint,#555);opacity:.5}
#interaction{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:var(--space-2,8px) var(--space-3,12px) calc(env(safe-area-inset-bottom,0px) + var(--space-2,8px));background:var(--bg);border-top:1px solid var(--line);color:var(--hot);font-size:14px;text-align:center;pointer-events:none}
#interaction[hidden]{display:none}
#dev{padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--space-12,48px))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="notice" hidden onclick="this.hidden=true"></div>
<div id="safe"></div>
<output id="interaction" hidden aria-live="polite"></output>
<div id="scrim" hidden></div>
<div id="part-bar"><button id="edit-part" hidden aria-label="Edit selected part"></button><button id="delete-part" hidden aria-label="Delete selected"></button></div>
<button id="to-start" hidden aria-label="Set to start"></button>
<div id="clip-bar"><button id="copy-parts" hidden aria-label="Copy selected"></button><button id="paste-parts" hidden aria-label="Paste"></button></div>
<div id="history"><button id="undo-all" aria-label="Undo"></button><button id="redo-all" aria-label="Redo"></button></div>
<div id="dev" hidden role="dialog" aria-label="Part controls">
  <div id="sheet-top"><div id="grab" role="button" aria-label="Tuck away or bring back the sheet"></div>
  <div id="editor-head"><span id="editor-title"></span><button id="editor-undo" aria-label="Undo"></button><button id="editor-redo" aria-label="Redo"></button><button id="editor-close" aria-label="Close"></button></div></div>
  <div id="panel"></div>
</div>
<script type="text/x-cogs-worklet" id="engine">
'use strict';
//@include engine.worklet.js
//@include wave.spec.js
//@include wave.worklet.js
</script>

</body>
</html>
