<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>cogs desk</title>
<style>
/*@include base.css*/
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:12px/1.3 var(--rig-font-mono,ui-monospace,Menlo,Consolas,monospace)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bar{position:fixed;top:0;right:0;bottom:0;display:flex;background:var(--bg);border-left:1px solid var(--line)}
#bar.scrap{border-left-color:var(--bad)}
#drawer{width:0;overflow:hidden;transition:width .16s cubic-bezier(.16,1,.3,1)}
#bar.open #drawer{width:360px}
#panel{width:360px;height:100%;overflow-y:auto;padding:8px;border-right:1px solid var(--line);user-select:text}
#rail{width:72px;display:flex;flex-direction:column;overflow-y:auto;padding:4px 0}
#rail button{display:flex;flex-direction:column;align-items:center;gap:1px;margin:1px 4px;padding:3px 0;background:none;color:var(--dim);font-size:11px}
#rail button:hover{background:var(--pad);color:var(--fg)}
#rail button.on{background:var(--pad);color:var(--hot)}
#rail button:disabled{opacity:.35;background:none}
#rail button kbd{font:inherit;font-size:10px;color:var(--dim)}
#rail button.toggle{color:var(--fg);background:var(--pad);margin-bottom:6px}
#rail hr{width:48px;border:0;border-top:1px solid var(--line);margin:4px auto}
#rail canvas{width:40px;height:30px}
#rail .rx{display:grid;place-items:center;height:22px}
#dock{position:fixed;left:0;bottom:0;max-height:44vh;display:grid;grid-template-columns:250px 1fr;background:var(--bg);border-top:1px solid var(--line)}
#dock[hidden]{display:none}
#dock-tools{padding:6px 8px;overflow-y:auto;border-right:1px solid var(--line)}
#dock-tools .row{grid-template-columns:76px 1fr 56px}
#dock-tools h3{margin:0 0 4px;font:inherit;color:var(--dim);font-weight:normal}
#dock-strip{overflow:auto;padding:4px 8px}
#dock-strip .roll{margin:0}
.row{grid-template-columns:100px 1fr 72px}.ro{grid-template-columns:100px 1fr}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="notice" hidden onclick="this.hidden=true"></div>
<div id="dock" hidden><div id="dock-tools"></div><div id="dock-strip"></div></div>
<aside id="bar" class="open"><div id="drawer"><div id="panel"></div></div><nav id="rail"></nav></aside>
