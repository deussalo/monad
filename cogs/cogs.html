class Allpass{
  constructor(len){this.buf=new Float32Array(len);this.len=len;this.i=0}

class Svf{

  run(x,g,k){const h=(x-(2*k+g)*this.s1-this.s2)/(1+g*(g+2*k)),b=g*h+this.s1,l=g*b+this.s2;

class PitchShifter{

<script>

    ['hard','hard',0,1,.01],['decay','decay s',.02,8,.01],['damp','damp',0,2,.01]],
  kick:[['tune','tune Hz',20,200,1],['sweep','sweep x',1,10,.1],['pdecay','p decay s',.005,.3,.001],['decay','decay s',.02,2,.01]],
  snare:[['tune','tune Hz',60,600,1],['tone','tone',0,1,.01],['cutoff','cutoff Hz',200,12000,10],['decay','decay s',.02,1,.005]],

/* ---------- world ---------- */
const W={cogs:[],arms:[],pads:[],readers:[],next:1};
let simT=0,tool='select',sel=null,draft=null;
const view={x:0,y:0};
const stats={events:0,late:0,steps:0,stepsTick:0,log:[]};
const clock={off:0,shift:0,audio:false,view:0,paused:false};

const stackOf=c=>W.cogs.filter(o=>Math.hypot(o.x-c.x,o.y-c.y)<=S.coaxTol);

const ringR=(c,i)=>{const n=c.track.rings,r=radius(c);return n>1?r*(.25+.65*i/(n-1)):r*.6};
const ringNote=(t,i)=>{const sc=SCALES[t.scale];return t.base+sc[i%sc.length]+12*Math.floor(i/sc.length)};

  const cs=W.cogs,adj=new Map(cs.map(c=>[c,[]]));

function snap(c){

    const g=Math.abs(d-radius(o)-radius(c));if(g<bestGap){bestGap=g;best=o}

function armHit(p,t){
  const {c,arm,pad,edge,s}=p,px=c.x+Math.cos(edge)*s,py=c.y+Math.sin(edge)*s;

function advance(tEnd){

/* ---------- audio ---------- */

  if(ac){if(ac.state!=='running')ac.resume();return}

      channelCount:2,channelCountMode:'explicit',processorOptions:{voices:64,lines:16,space:{...SPACE}}});

function flushStrikes(){const d=new Float64Array(strikes);strikes.length=0;engineNode.port.postMessage({type:'strikes',d},[d.buffer])}

  const H=BODIES.harmonic,F=BODIES[v.body],f0=hz(midi),n=H.length,f=[],g=[],t=[];
  const contact=clamp((.0016-.0014*v.hard)*Math.pow(Math.max(.02,x),-.35),.00012,.004);

  if(!strikes.length)queueMicrotask(flushStrikes);
  strikes.push(when*ac.sampleRate,key,amp*.3,contact,0,pan,n,...f,...g,...t);
}
function drum(v,when,amp,pan){
  const g=ac.createGain(),p=ac.createStereoPanner(),end=when+v.decay;
  p.pan.value=pan;g.connect(p);p.connect(drumBus);
  g.gain.setValueAtTime(amp,when);g.gain.exponentialRampToValueAtTime(1e-4,end);
  const src=[];

    const o=ac.createOscillator();o.frequency.setValueAtTime(v.tune*v.sweep,when);
    o.frequency.exponentialRampToValueAtTime(v.tune,when+v.pdecay);o.connect(g);src.push(o);
  }else{
    const n=ac.createBufferSource(),f=ac.createBiquadFilter(),ng=ac.createGain();
    n.buffer=noise;n.loop=true;f.type=v.kind==='hat'?'highpass':'bandpass';f.frequency.value=v.cutoff;f.Q.value=.8;
    ng.gain.value=v.kind==='snare'?1-v.tone:1;n.connect(f);f.connect(ng);ng.connect(g);src.push(n);
    if(v.kind==='snare'){const o=ac.createOscillator(),tg=ac.createGain();o.type='triangle';o.frequency.value=v.tune;
      tg.gain.value=v.tone;o.connect(tg);tg.connect(g);src.push(o)}

function fire(v,midi,t,vn,x,key,src){
  stats.events++;
  stats.log.push({t,src,vn});if(stats.log.length>256)stats.log.shift();
  if(!clock.audio||engineState!=='ready')return;
  const vx=clamp(vn/S.vRef,0,1),amp=v.level*(1-v.velSense+v.velSense*Math.pow(vx,S.velCurve));
  if(amp<=0)return;

  if(when<ac.currentTime){stats.late++;when=ac.currentTime}
  const pan=clamp((x-view.x)/300,-.9,.9);
  if(v.kind==='modal')modal(v,midi,when,amp,pan,key,vx);else drum(v,when,amp,pan);

/* ---------- clock ---------- */
const audioLive=()=>!!(ac&&ac.state==='running'&&engineState==='ready');
const clockBase=()=>clock.audio?ac.currentTime:performance.now()/1000;
const nowSec=()=>clockBase()+clock.shift;
function syncClock(){
  const live=audioLive();if(live===clock.audio)return;
  const before=nowSec();clock.audio=live;clock.shift=before-clockBase();
}
function setPaused(p){
  if(p===clock.paused)return;
  clock.paused=p;if(!p)clock.off=nowSec()-clock.view;
}

/* ---------- render ---------- */
const cv=$('#c'),cx=cv.getContext('2d');
let dpr=1,CW=0,CH=0;
function resize(){const r=cv.getBoundingClientRect();dpr=devicePixelRatio||1;CW=r.width;CH=r.height;cv.width=Math.round(CW*dpr);cv.height=Math.round(CH*dpr)}
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
let BG,FG,DIM,FAINT,SEL,BAD,HOT,READ,PAD;
function readPalette(){[BG,FG,DIM,FAINT,SEL,BAD,HOT,READ,PAD]=['bg','fg','dim','faint','sel','bad','hot','read','pad'].map(k=>css('--'+k))}
readPalette();
const glow=t=>t==null||clock.view<t?0:Math.exp(-(clock.view-t)/.12);
function hot(t,base,g=cx){const e=glow(t);if(e<=.03)return base;g.globalAlpha=.35+.65*e;return HOT}
const isSel=o=>sel&&sel.o===o;
function line(x1,y1,x2,y2){cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke()}
function circle(x,y,r,fill){cx.beginPath();cx.arc(x,y,r,0,TAU);fill?cx.fill():cx.stroke()}
function draw(){
  cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;cx.fillStyle=BG;cx.fillRect(0,0,cv.width,cv.height);
  const z=S.zoom*dpr,px=1/S.zoom;
  cx.setTransform(z,0,0,z,dpr*CW/2-view.x*z,dpr*CH/2-view.y*z);
  cx.lineWidth=px;
  if(S.grid){cx.strokeStyle=FAINT;const x0=Math.floor((view.x-CW/2/S.zoom)/50)*50,y0=Math.floor((view.y-CH/2/S.zoom)/50)*50;
    for(let x=x0;x<view.x+CW/2/S.zoom;x+=50)line(x,y0,x,view.y+CH/2/S.zoom);
    for(let y=y0;y<view.y+CH/2/S.zoom;y+=50)line(x0,y,view.x+CW/2/S.zoom,y)}
  for(const c of [...W.cogs].sort((a,b)=>a.layer-b.layer)){
    const th=renderTh(c),r=radius(c),col=isSel(c)?SEL:c.jam?BAD:DIM;
    cx.strokeStyle=col;cx.setLineDash(c.layer?[4*px,3*px]:[]);circle(c.x,c.y,r);cx.setLineDash([]);
    cx.beginPath();
    for(let k=0;k<c.n;k++){const a=th+k*TAU/c.n,ca=Math.cos(a),sa=Math.sin(a);cx.moveTo(c.x+ca*(r-3),c.y+sa*(r-3));cx.lineTo(c.x+ca*(r+3),c.y+sa*(r+3))}
    cx.stroke();
    cx.strokeStyle=isSel(c)?SEL:FG;line(c.x,c.y,c.x+Math.cos(th)*(r-5),c.y+Math.sin(th)*(r-5));
    cx.fillStyle=c.jam?BAD:FG;circle(c.x,c.y,3*px,!!c.motor);
    if(c.track){
      const t=c.track;cx.strokeStyle=FAINT;
      for(let i=0;i<t.rings;i++)circle(c.x,c.y,ringR(c,i));
      const rIn=ringR(c,0),rOut=ringR(c,t.rings-1);
      for(let k=0;k<t.div;k++){const a=th+k*TAU/t.div;line(c.x+Math.cos(a)*rIn,c.y+Math.sin(a)*rIn,c.x+Math.cos(a)*rOut,c.y+Math.sin(a)*rOut)}
      for(const d of t.dots){const R=ringR(c,d.ring),a=th+d.a;cx.fillStyle=hot(d.flash,FG);circle(c.x+Math.cos(a)*R,c.y+Math.sin(a)*R,(3+2*glow(d.flash))*px,true);cx.globalAlpha=1}
    }
  }
  if(S.windows){
    cx.strokeStyle=FAINT;
    for(const arm of W.arms)for(const pad of W.pads){const c=arm.cog,h=hitWindow(c,arm,pad);if(!h)continue;
      cx.beginPath();cx.arc(c.x,c.y,h.s,h.beta-h.half,h.beta+h.half);cx.stroke();
      if(c.w){const e=c.w>0?h.beta-h.half:h.beta+h.half;line(c.x,c.y,c.x+Math.cos(e)*h.s,c.y+Math.sin(e)*h.s)}}
  }
  for(const p of W.pads){cx.fillStyle=hot(p.flash,PAD);circle(p.x,p.y,p.r,true);cx.globalAlpha=1;cx.strokeStyle=isSel(p)?SEL:FG;circle(p.x,p.y,p.r)}
  cx.lineWidth=3*px;
  for(const a of W.arms){const c=a.cog,ang=renderTh(c)+a.a,ux=Math.cos(ang),uy=Math.sin(ang);
    cx.strokeStyle=isSel(a)?SEL:hot(a.flash,FG);line(c.x+ux*a.r0,c.y+uy*a.r0,c.x+ux*(a.r0+a.len),c.y+uy*(a.r0+a.len));cx.globalAlpha=1}
  cx.lineWidth=2*px;
  for(const r of W.readers){cx.strokeStyle=isSel(r)?SEL:hot(r.flash,READ);line(r.x1,r.y1,r.x2,r.y2);cx.globalAlpha=1}
  cx.lineWidth=px;
  if(S.ids){cx.fillStyle=DIM;cx.font=`${10*px}px monospace`;
    for(const c of W.cogs)cx.fillText('c'+c.id,c.x+4*px,c.y-4*px);
    for(const p of W.pads)cx.fillText('p'+p.id,p.x+p.r+2*px,p.y);
    for(const r of W.readers)cx.fillText('r'+r.id,r.x2+2*px,r.y2);
    for(const a of W.arms){const ang=renderTh(a.cog)+a.a,R=a.r0+a.len;cx.fillText('a'+a.id,a.cog.x+Math.cos(ang)*R,a.cog.y+Math.sin(ang)*R)}}
}

/* ---------- edit ---------- */
function pickCog(p,filter=()=>true){
  return W.cogs.filter(c=>filter(c)&&Math.hypot(c.x-p.x,c.y-p.y)<=radius(c)).sort((a,b)=>b.layer-a.layer||a.n-b.n)[0]||null;
}
function segDist(p,x1,y1,x2,y2){const ex=x2-x1,ey=y2-y1,u=clamp(((p.x-x1)*ex+(p.y-y1)*ey)/(ex*ex+ey*ey||1),0,1);return Math.hypot(p.x-x1-ex*u,p.y-y1-ey*u)}
function hitTest(p){
  const tol=6/S.zoom;
  for(const o of W.pads)if(Math.hypot(o.x-p.x,o.y-p.y)<=o.r+tol)return {type:'pad',o};
  for(const o of W.readers)if(segDist(p,o.x1,o.y1,o.x2,o.y2)<=tol)return {type:'reader',o};
  for(const o of W.arms){const c=o.cog,a=renderTh(c)+o.a,ux=Math.cos(a),uy=Math.sin(a);
    if(segDist(p,c.x+ux*o.r0,c.y+uy*o.r0,c.x+ux*(o.r0+o.len),c.y+uy*(o.r0+o.len))<=tol)return {type:'arm',o}}
  const c=pickCog(p);return c?{type:'cog',o:c}:null;
}
function newCog(p,disc){
  const axle=W.cogs.find(c=>Math.hypot(c.x-p.x,c.y-p.y)<=Math.max(S.coaxTol,8/S.zoom));
  const c={id:W.next++,x:axle?axle.x:p.x,y:axle?axle.y:p.y,n:disc?48:12,motor:0,
    layer:axle?Math.max(...stackOf(axle).map(s=>s.layer))+1:0,th:0,w:0,
    track:disc?{rings:12,base:48,scale:'pentatonic',div:16,dots:[]}:null};
  const x0=c.x,y0=c.y;W.cogs.push(c);select('cog',c);
  const place=q=>{
    if(q){const r=Math.hypot(q.x-x0,q.y-y0);if(r>4)c.n=Math.max(disc?12:6,Math.round(r*TAU/TOOTH))}
    c.x=x0;c.y=y0;if(!axle)snap(c);solve();
  };
  place(null);
  return {move:place,up:()=>{place(null);changed(true)},cancel:removeSel};
}
const TOOLS={
  select(p,e){
    const h=hitTest(p);
    if(!h){select(null);const sx=e.clientX,sy=e.clientY,vx=view.x,vy=view.y;
      return {move:(q,e2)=>{view.x=vx-(e2.clientX-sx)/S.zoom;view.y=vy-(e2.clientY-sy)/S.zoom},up:()=>changed()}}
    select(h.type,h.o);const o=h.o;
    if(h.type==='pad'){const dx=o.x-p.x,dy=o.y-p.y;return {move:q=>{o.x=q.x+dx;o.y=q.y+dy;refreshInspector()},up:()=>changed()}}
    if(h.type==='reader'){
      const end=Math.hypot(p.x-o.x1,p.y-o.y1)<10/S.zoom?1:Math.hypot(p.x-o.x2,p.y-o.y2)<10/S.zoom?2:0,s={...o};
      return {move:q=>{const dx=q.x-p.x,dy=q.y-p.y;
        if(end!==2){o.x1=s.x1+dx;o.y1=s.y1+dy}if(end!==1){o.x2=s.x2+dx;o.y2=s.y2+dy}refreshInspector()},up:()=>changed()}}
    if(h.type==='arm')return {move:q=>{const c=o.cog;o.a=wrap(Math.atan2(q.y-c.y,q.x-c.x)-renderTh(c));
      o.len=Math.max(4,Math.hypot(q.x-c.x,q.y-c.y)-o.r0);refreshInspector()},up:()=>changed()};
    const stack=stackOf(o),start=stack.map(c=>[c,c.x,c.y]);
    return {move:q=>{for(const[c,x,y]of start){c.x=x+q.x-p.x;c.y=y+q.y-p.y}
      const bx=o.x,by=o.y;snap(o);for(const c of stack)if(c!==o){c.x+=o.x-bx;c.y+=o.y-by}solve();refreshInspector()},up:()=>changed(true)};
  },
  cog:p=>newCog(p,false),
  disc:p=>newCog(p,true),
  arm(p){
    const c=pickCog(p);if(!c)return null;
    const a={id:W.next++,cog:c,a:0,r0:0,len:4};W.arms.push(a);select('arm',a);
    const set=q=>{a.a=wrap(Math.atan2(q.y-c.y,q.x-c.x)-renderTh(c));a.len=Math.max(4,Math.hypot(q.x-c.x,q.y-c.y))};
    set(p);return {move:set,up:()=>changed(true),cancel:removeSel};
  },
  pad(p){
    const o={id:W.next++,x:p.x,y:p.y,r:12,voice:makeVoice('kick'),hits:0,lastV:0};W.pads.push(o);select('pad',o);
    return {move:q=>{const r=Math.hypot(q.x-p.x,q.y-p.y);if(r>4)o.r=r},up:()=>changed(true),cancel:removeSel};
  },
  reader(p){
    const o={id:W.next++,x1:p.x,y1:p.y,x2:p.x,y2:p.y,voice:makeVoice('modal'),hits:0,lastV:0};W.readers.push(o);select('reader',o);
    return {move:q=>{o.x2=q.x;o.y2=q.y},cancel:removeSel,up:()=>{if(Math.hypot(o.x2-o.x1,o.y2-o.y1)<4)removeSel();changed(true)}};
  },
  dot(p){
    const c=pickCog(p,c=>c.track);if(!c)return null;
    const t=c.track,d=Math.hypot(p.x-c.x,p.y-c.y),r=radius(c);
    const ring=t.rings>1?clamp(Math.round((d/r-.25)/.65*(t.rings-1)),0,t.rings-1):0;
    const step=TAU/t.div,a=wrap(Math.round(wrap(Math.atan2(p.y-c.y,p.x-c.x)-renderTh(c))/step)*step);
    const on=dotAt(t,ring,a)<0;setDot(t,{ring,a},on);
    select('cog',c);changed();return {move(){},up(){},cancel:()=>{setDot(t,{ring,a},!on);changed()}};
  }
};
function removeSel(){
  if(!sel)return;const o=sel.o;
  if(sel.type==='cog'){W.cogs=W.cogs.filter(c=>c!==o);W.arms=W.arms.filter(a=>a.cog!==o)}
  else W[sel.type+'s']=W[sel.type+'s'].filter(x=>x!==o);
  select(null);changed(true);
}

const dotAt=(t,ring,a)=>t.dots.findIndex(o=>o.ring===ring&&Math.abs(wrap(o.a-a+Math.PI)-Math.PI)<1e-6);
function setDot(t,cell,on){const i=dotAt(t,cell.ring,cell.a);if(on&&i<0)t.dots.push(cell);else if(!on&&i>=0)t.dots.splice(i,1)}

/* ---------- roll: the disc unwrapped into a strip, time left to right ---------- */
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName=m=>NOTE_NAMES[m%12]+(Math.floor(m/12)-1);
const ROLL_LABEL=30,ROLL_ROW=11;
let roll=null;
const rollDir=c=>c.w<0?-1:1;
const rollU=(c,a)=>wrap(-rollDir(c)*a)/TAU;
function readerPlayheads(c){
  const R=ringR(c,Math.floor((c.track.rings-1)/2)),th=renderTh(c),out=[];
  for(const rd of W.readers){
    const dx=rd.x2-rd.x1,dy=rd.y2-rd.y1,fx=rd.x1-c.x,fy=rd.y1-c.y,A=dx*dx+dy*dy,B=2*(fx*dx+fy*dy),disc=B*B-4*A*(fx*fx+fy*fy-R*R);
    if(!A||disc<0)continue;
    for(const s of [(-B-Math.sqrt(disc))/(2*A),(-B+Math.sqrt(disc))/(2*A)])
      if(s>=0&&s<=1)out.push({rd,u:rollU(c,Math.atan2(fy+dy*s,fx+dx*s)-th)});
  }
  return out;
}
function rollGeom(){const t=roll.c.track,cw=Math.max(6,Math.floor((roll.box.clientWidth-ROLL_LABEL)/t.div));return {cw,W:ROLL_LABEL+cw*t.div,H:ROLL_ROW*t.rings}}
function rollCell(e){
  const t=roll.c.track,g=rollGeom(),r=roll.cv.getBoundingClientRect();
  const col=Math.floor((e.clientX-r.left-ROLL_LABEL)/g.cw),row=Math.floor((e.clientY-r.top)/ROLL_ROW);
  if(col<0||col>=t.div||row<0||row>=t.rings)return null;
  return {ring:t.rings-1-row,a:wrap(-rollDir(roll.c)*col*TAU/t.div)};
}
function drawRoll(){
  if(!roll||!roll.cv.isConnected)return;
  const c=roll.c,t=c.track,g=rollGeom(),cv2=roll.cv,x=cv2.getContext('2d'),gw=g.cw*t.div;
  if(cv2.width!==g.W*dpr||cv2.height!==g.H*dpr){cv2.width=g.W*dpr;cv2.height=g.H*dpr;cv2.style.width=g.W+'px';cv2.style.height=g.H+'px'}
  x.setTransform(dpr,0,0,dpr,0,0);x.fillStyle=BG;x.fillRect(0,0,g.W,g.H);
  x.font='9px monospace';x.textBaseline='middle';
  for(let row=0;row<t.rings;row++){
    const note=ringNote(t,t.rings-1-row),y=row*ROLL_ROW;
    x.fillStyle=DIM;x.fillText(noteName(note),2,y+ROLL_ROW/2);
    if(note%12===t.base%12){x.fillStyle=PAD;x.fillRect(ROLL_LABEL,y,gw,ROLL_ROW)}
  }
  x.lineWidth=1;
  for(let k=0;k<=t.div;k++){x.strokeStyle=k%4?FAINT:DIM;x.beginPath();x.moveTo(ROLL_LABEL+k*g.cw+.5,0);x.lineTo(ROLL_LABEL+k*g.cw+.5,g.H);x.stroke()}
  x.strokeStyle=FAINT;
  for(let r=0;r<=t.rings;r++){x.beginPath();x.moveTo(ROLL_LABEL,r*ROLL_ROW+.5);x.lineTo(ROLL_LABEL+gw,r*ROLL_ROW+.5);x.stroke()}
  for(const d of t.dots){
    if(d.ring>=t.rings)continue;
    x.fillStyle=hot(d.flash,FG,x);x.fillRect(ROLL_LABEL+rollU(c,d.a)*gw+1,(t.rings-1-d.ring)*ROLL_ROW+1,g.cw-1,ROLL_ROW-1);x.globalAlpha=1;
  }
  x.lineWidth=2;
  for(const p of readerPlayheads(c)){x.strokeStyle=hot(p.rd.flash,READ,x);x.beginPath();x.moveTo(ROLL_LABEL+p.u*gw,0);x.lineTo(ROLL_LABEL+p.u*gw,g.H);x.stroke();x.globalAlpha=1}
}
function rollSection(f,c){
  const t=c.track,cv2=el('canvas'),box=el('div',{},cv2);
  box.style.cssText='overflow-x:auto;margin:4px 0';cv2.style.cssText='display:block;touch-action:none;cursor:crosshair';
  roll={cv:cv2,box,c};let paint=null;
  cv2.onpointerdown=e=>{const cell=rollCell(e);if(!cell)return;cv2.setPointerCapture(e.pointerId);paint=dotAt(t,cell.ring,cell.a)<0;setDot(t,cell,paint)};
  cv2.onpointermove=e=>{if(paint===null)return;const cell=rollCell(e);if(cell)setDot(t,cell,paint)};
  cv2.onpointerup=cv2.onpointercancel=()=>{if(paint!==null){paint=null;changed()}};
  const shift=k=>()=>{const s=rollDir(c)*TAU/t.div;for(const d of t.dots)d.a=wrap(d.a-k*s);changed()};
  f.append(box,el('button',{textContent:'shift <',onclick:shift(-1)}),el('button',{textContent:'shift >',onclick:shift(1)}));
  for(const rd of new Set(readerPlayheads(c).map(p=>p.rd)))f.append(el('button',{textContent:'reader '+rd.id+' patch',onclick:()=>select('reader',rd)}));
}

/* ---------- persistence ---------- */
let saveTimer=0;
function changed(structural){
  if(structural)solve();
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>storage.put(JSON.stringify(serialize())),400);
  refreshInspector();
}
function serialize(){
  return {S,SPACE,view,
    cogs:W.cogs.map(c=>({id:c.id,x:c.x,y:c.y,n:c.n,motor:c.motor,layer:c.layer,th:wrap(c.th),
      track:c.track&&{...c.track,dots:c.track.dots.map(d=>({ring:d.ring,a:d.a}))}})),
    arms:W.arms.map(a=>({id:a.id,cog:a.cog.id,a:a.a,r0:a.r0,len:a.len})),
    pads:W.pads.map(p=>({id:p.id,x:p.x,y:p.y,r:p.r,voice:p.voice})),
    readers:W.readers.map(r=>({id:r.id,x1:r.x1,y1:r.y1,x2:r.x2,y2:r.y2,voice:r.voice}))};
}
function deserialize(j){
  const cogs=j.cogs.map(c=>({...c,w:0}));
  const byId=new Map(cogs.map(c=>[c.id,c]));
  const arms=j.arms.map(a=>{const c=byId.get(a.cog);if(!c)throw new Error(`arm ${a.id}: no cog ${a.cog}`);return {...a,cog:c}});
  for(const o of [...j.pads,...j.readers])if(!VOICES[o.voice.kind])throw new Error(`${o.id}: voice kind ${o.voice.kind}`);
  W.cogs=cogs;W.arms=arms;
  W.pads=j.pads.map(p=>({...p,hits:0,lastV:0}));W.readers=j.readers.map(r=>({...r,hits:0,lastV:0}));
  W.next=1+Math.max(0,...[...W.cogs,...W.arms,...W.pads,...W.readers].map(o=>o.id));
  Object.assign(S,j.S);Object.assign(SPACE,j.SPACE);Object.assign(view,j.view);
  select(null);solve();applyAudioSettings();syncRows();changed();
}
function demo(){
  const r=n=>n*TOOTH/TAU,A={x:0,y:-110},a=r(20),b=r(40),c=r(10),d=r(60);
  const B={x:A.x+Math.cos(3.5)*(a+b),y:A.y+Math.sin(3.5)*(a+b)},C={x:A.x+a+c,y:A.y},D={x:A.x,y:A.y+a+d};
  const dots=[[0,0],[4,2],[2,4],[7,6],[5,8],[9,9],[3,10],[6,12],[8,14],[1,15]].map(([ring,k])=>({ring,a:k*TAU/16}));
  deserialize({S:{...S},SPACE:{...SPACE},view:{x:0,y:-35},
    cogs:[{id:1,...A,n:20,motor:60,layer:0,th:0,track:null},{id:2,...B,n:40,motor:0,layer:0,th:0,track:null},
      {id:3,...C,n:10,motor:0,layer:0,th:0,track:null},
      {id:4,...D,n:60,motor:0,layer:0,th:0,track:{rings:12,base:57,scale:'minpent',div:16,dots}}],
    arms:[{id:5,cog:1,a:0,r0:0,len:62},{id:6,cog:1,a:Math.PI,r0:0,len:62},{id:7,cog:2,a:0,r0:0,len:85},
      {id:8,cog:3,a:0,r0:0,len:40},{id:9,cog:3,a:Math.PI,r0:0,len:40}],
    pads:[{id:10,x:A.x,y:A.y-50,r:10,voice:makeVoice('kick',{level:.9,velSense:.5})},
      {id:11,x:B.x-30,y:B.y+75,r:10,voice:makeVoice('snare')},
      {id:12,x:C.x+28,y:C.y-24,r:7,voice:makeVoice('hat',{level:.35,velSense:.8})}],
    readers:[{id:13,x1:D.x+18,y1:D.y,x2:D.x+d,y2:D.y,voice:makeVoice('modal',{level:.6,velSense:.3})}]});
}

/* ---------- panel ---------- */
const panel=$('#panel'),rows=[],readouts=[];
function el(tag,props={},...kids){const e=Object.assign(document.createElement(tag),props);e.append(...kids);return e}
function section(title,parent=panel){const f=el('fieldset',{},el('legend',{textContent:title}));parent.append(f);return f}
function numRow(parent,label,min,max,step,get,set){
  const range=el('input',{type:'range',min,max,step}),num=el('input',{type:'number',min,max,step});
  const sync=()=>{const v=get();range.value=v;num.value=+(+v).toFixed(4)};
  const put=src=>()=>{const v=+src.value;if(!Number.isFinite(v))return;set(clamp(v,min,max));sync()};
  range.oninput=put(range);num.oninput=put(num);num.onchange=sync;
  const row=el('div',{className:'row'},el('span',{textContent:label}),range,num);row.dataset.k=label;
  parent.append(row);rows.push(sync);sync();return row;
}
function selRow(parent,label,options,get,set){
  const s=el('select',{},...options.map(o=>el('option',{value:o,textContent:o})));
  const sync=()=>{s.value=get()};s.onchange=()=>set(s.value);
  const row=el('div',{className:'row'},el('span',{textContent:label}),s,el('span'));row.dataset.k=label;
  parent.append(row);rows.push(sync);sync();return row;
}
function roRow(parent,label,fn){const b=el('b');const row=el('div',{className:'ro'},el('span',{textContent:label}),b);row.dataset.k=label;parent.append(row);readouts.push([b,fn])}
const bind=(o,k,after)=>[()=>o[k],v=>{o[k]=v;after&&after()}];
const syncRows=()=>{for(const s of rows)s()};

const toolBtns={};
function setTool(t){tool=t;for(const k in toolBtns)toolBtns[k].className=k===t?'on':''}
function buildPanel(){
  const tf=section('tool');
  for(const t of Object.keys(TOOLS)){toolBtns[t]=el('button',{textContent:t,onclick:()=>setTool(t)});toolBtns[t].dataset.tool=t;tf.append(toolBtns[t])}
  setTool('select');
  const tr=section('transport');
  const btn=(label,fn)=>{const b=el('button',{textContent:label,onclick:fn});b.dataset.act=label;tr.append(b);return b};
  btn('audio',initAudio);btn('pause',()=>setPaused(!clock.paused));btn('del',removeSel);
  btn('demo',demo);btn('clear',()=>deserialize({S:{...S},SPACE:{...SPACE},view:{x:0,y:0},cogs:[],arms:[],pads:[],readers:[]}));
  btn('reset hits',()=>{for(const o of [...W.pads,...W.readers])o.hits=0;stats.events=stats.late=0;stats.log.length=0});
  const st=section('stats');
  roRow(st,'audio',()=>`${ac?ac.state:'off'} ${engineState}${ac?' '+ac.sampleRate+'Hz '+(1000*(ac.baseLatency||0)).toFixed(1)+'ms':''}`);
  roRow(st,'clock',()=>`${clock.audio?'audio':'perf'} ${clock.paused?'paused':'run'} t=${clock.view.toFixed(2)}`);
  roRow(st,'ahead ms',()=>(1000*(simT-clock.view)).toFixed(1));
  roRow(st,'steps/tick',()=>stats.stepsTick);
  roRow(st,'events',()=>`${stats.events} late ${stats.late}`);
  roRow(st,'engine',()=>`v${engineStats.voices??'-'} s${engineStats.strikes??'-'} st${engineStats.steals??'-'} dr${engineStats.drops??'-'}`);
  roRow(st,'peak dB',()=>peak>0?(20*Math.log10(peak)).toFixed(1):'-inf');
  roRow(st,'storage',()=>storage.ok?'local':'off: '+storage.why+', use json export');
  roRow(st,'world',()=>`c${W.cogs.length} a${W.arms.length} p${W.pads.length} r${W.readers.length}`);
  inspector=section('selection');
  const wf=section('world');
  for(const[k,l,mn,mx,st2]of S_DEFS)numRow(wf,l,mn,mx,st2,...bind(S,k,()=>{applyAudioSettings();if(/Tol/.test(k))solve()}));
  const sp=section('space');
  for(const[k,l,mn,mx,st2]of SPACE_DEFS)numRow(sp,l,mn,mx,st2,...bind(SPACE,k,applyAudioSettings));
  const js=section('json'),ta=el('textarea'),msg=el('b');
  js.append(ta,el('button',{textContent:'export',onclick:()=>{ta.value=JSON.stringify(serialize());msg.textContent='ok'}}),
    el('button',{textContent:'import',onclick:()=>{try{deserialize(JSON.parse(ta.value));msg.textContent='ok'}catch(e){msg.textContent=e.message}}}),msg);
}
function applyAudioSettings(){
  if(master)master.gain.value=S.master;
  if(engineNode)engineNode.port.postMessage({type:'space',...SPACE});
}
let inspector=null,inspectorReadouts=[];
function select(type,o){sel=type?{type,o}:null;buildInspector()}
function voiceRows(f,owner,withNote){
  const v=owner.voice;
  selRow(f,'kind',Object.keys(VOICES),()=>v.kind,k=>{owner.voice=makeVoice(k,{level:v.level,velSense:v.velSense});buildInspector();changed()});
  for(const[k,l,a,b,s]of [...VOICE_DEFS[v.kind],...COMMON_DEFS]){
    if(k==='note'&&!withNote)continue;
    if(Array.isArray(a))selRow(f,l,a,()=>v[k],x=>{v[k]=x;changed()});else numRow(f,l,a,b,s,...bind(v,k,changed));
  }
}
function buildInspector(){
  if(!inspector)return;
  for(const r of inspectorReadouts){const i=readouts.indexOf(r);if(i>=0)readouts.splice(i,1)}
  const before=readouts.length;
  roll=null;
  inspector.replaceChildren(el('legend',{textContent:sel?`${sel.type} ${sel.o.id}`:'selection'}));
  const o=sel&&sel.o,f=inspector;
  if(sel&&sel.type==='cog'){
    numRow(f,'teeth',6,240,1,...bind(o,'n',()=>changed(true)));
    numRow(f,'motor rpm',-600,600,.1,...bind(o,'motor',()=>changed(true)));
    numRow(f,'layer',0,7,1,...bind(o,'layer',()=>changed(true)));
    numRow(f,'x',-3000,3000,.5,...bind(o,'x',()=>changed(true)));
    numRow(f,'y',-3000,3000,.5,...bind(o,'y',()=>changed(true)));
    numRow(f,'phase deg',0,360,.1,()=>wrap(o.th)*180/Math.PI,v=>{o.th=v*Math.PI/180;changed()});
    roRow(f,'radius',()=>radius(o).toFixed(2));
    roRow(f,'rpm',()=>(o.w*60/TAU).toFixed(3));
    roRow(f,'period ms',()=>o.w?(1000*TAU/Math.abs(o.w)).toFixed(2):'-');
    roRow(f,'ratio',()=>o.driver?`${(o.w/o.driver.w||0).toFixed(4)} of c${o.driver.id}`:'-');
    roRow(f,'state',()=>o.jam?'JAM':o.w?'turning':'idle');
    if(o.track){
      const t=o.track;
      numRow(f,'rings',1,36,1,...bind(t,'rings',()=>{t.dots=t.dots.filter(d=>d.ring<t.rings);changed()}));
      numRow(f,'base midi',12,108,1,...bind(t,'base',changed));
      selRow(f,'scale',Object.keys(SCALES),()=>t.scale,v=>{t.scale=v;changed()});
      numRow(f,'div',1,96,1,...bind(t,'div',changed));
      roRow(f,'dots',()=>t.dots.length);
      rollSection(f,o);
      f.append(el('button',{textContent:'clear dots',onclick:()=>{t.dots=[];changed()}}),
        el('button',{textContent:'drop track',onclick:()=>{o.track=null;buildInspector();changed()}}));
    }else f.append(el('button',{textContent:'add track',onclick:()=>{o.track={rings:12,base:48,scale:'pentatonic',div:16,dots:[]};buildInspector();changed()}}));
  }else if(sel&&sel.type==='arm'){
    numRow(f,'angle deg',0,360,.1,()=>o.a*180/Math.PI,v=>{o.a=v*Math.PI/180;changed()});
    numRow(f,'r0',0,500,.5,...bind(o,'r0',changed));
    numRow(f,'len',1,800,.5,...bind(o,'len',changed));
    roRow(f,'cog',()=>'c'+o.cog.id);
    roRow(f,'tip px/s',()=>(Math.abs(o.cog.w)*(o.r0+o.len)).toFixed(1));
  }else if(sel&&sel.type==='pad'){
    numRow(f,'x',-3000,3000,.5,...bind(o,'x',changed));
    numRow(f,'y',-3000,3000,.5,...bind(o,'y',changed));
    numRow(f,'radius',2,200,.5,...bind(o,'r',changed));
    voiceRows(f,o,true);
    roRow(f,'hits',()=>o.hits);
    roRow(f,'last vn',()=>o.lastV.toFixed(1));
  }else if(sel&&sel.type==='reader'){
    for(const k of ['x1','y1','x2','y2'])numRow(f,k,-3000,3000,.5,...bind(o,k,changed));
    voiceRows(f,o,false);
    roRow(f,'hits',()=>o.hits);
    roRow(f,'last vn',()=>o.lastV.toFixed(1));
  }
  inspectorReadouts=readouts.slice(before);
}
function refreshInspector(){syncRows()}

/* ---------- input ---------- */
const local=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
const screenToWorld=s=>({x:(s.x-CW/2)/S.zoom+view.x,y:(s.y-CH/2)/S.zoom+view.y});
const toWorld=e=>screenToWorld(local(e));
function zoomAt(s,zoom,anchor){S.zoom=clamp(zoom,.25,4);view.x=anchor.x-(s.x-CW/2)/S.zoom;view.y=anchor.y-(s.y-CH/2)/S.zoom;syncRows()}
const fingers=new Map();let pinch=null;
function pinchNow(){const[a,b]=[...fingers.values()];return {mid:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},d:Math.hypot(a.x-b.x,a.y-b.y)||1}}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);fingers.set(e.pointerId,local(e));
  if(fingers.size===2){
    if(draft){const d=draft;draft=null;d.cancel?d.cancel():d.up(toWorld(e),e)}
    const p=pinchNow();pinch={...p,zoom:S.zoom,anchor:screenToWorld(p.mid)};return;
  }
  if(fingers.size===1&&!pinch&&!draft)draft=TOOLS[tool](toWorld(e),e);
});
cv.addEventListener('pointermove',e=>{
  if(fingers.has(e.pointerId))fingers.set(e.pointerId,local(e));
  if(pinch){if(fingers.size>=2){const p=pinchNow();zoomAt(p.mid,pinch.zoom*p.d/pinch.d,pinch.anchor)}return}
  if(draft)draft.move(toWorld(e),e);
});
const endPointer=e=>{
  fingers.delete(e.pointerId);
  if(pinch){if(!fingers.size){pinch=null;changed()}return}
  if(draft){const d=draft;draft=null;d.up(toWorld(e),e)}
};
cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);
// Trackpad pinch arrives as wheel with ctrlKey; two-finger trackpad drag as plain wheel.
cv.addEventListener('wheel',e=>{
  e.preventDefault();const s=local(e);
  if(e.ctrlKey)zoomAt(s,S.zoom*Math.exp(-e.deltaY*.01),screenToWorld(s));
  else{view.x+=e.deltaX/S.zoom;view.y+=e.deltaY/S.zoom}
},{passive:false});
document.addEventListener('pointerup',initAudio);
document.addEventListener('keydown',e=>{
  initAudio();
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const t={v:'select',c:'cog',d:'disc',a:'arm',p:'pad',r:'reader',o:'dot'}[e.key];
  if(t)setTool(t);else if(e.key==='Delete'||e.key==='Backspace')removeSel();else if(e.key===' '){e.preventDefault();setPaused(!clock.paused)}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ac&&ac.state!=='running')ac.resume()});
addEventListener('resize',resize);

/* ---------- loop ---------- */
let roAt=0;const meterBuf=new Float32Array(2048);
function tick(){
  syncClock();
  if(!clock.paused){clock.view=nowSec()-clock.off;advance(clock.view+S.lookahead)}
}
function frame(){
  syncClock();
  if(!clock.paused)clock.view=nowSec()-clock.off;
  if(meter){meter.getFloatTimeDomainData(meterBuf);let m=0;for(const x of meterBuf)m=Math.max(m,Math.abs(x));peak=Math.max(m,peak*.95)}
  draw();drawRoll();
  const now=performance.now();
  if(now-roAt>250){roAt=now;readPalette();for(const[b,fn]of readouts)b.textContent=fn()}
  requestAnimationFrame(frame);
}
buildPanel();resize();
const saved=storage.get();
if(saved)try{deserialize(JSON.parse(saved))}catch(e){console.error('cogs: saved world rejected:',e.message);demo()}else demo();
clock.off=nowSec()-simT;
window.__cogs={W,S,SPACE,stats,clock,get simT(){return simT},serialize,deserialize,solve,
  engine:()=>({state:engineState,ac:ac&&ac.state,...engineStats})};
setInterval(tick,15);requestAnimationFrame(frame);
</script>
</body>
</html>
