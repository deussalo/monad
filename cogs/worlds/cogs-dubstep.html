<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>cogs</title>
<style>
:root{color-scheme:dark;--bg:var(--rig-bg,#111);--fg:var(--rig-text,#ddd);--dim:var(--rig-text-dim,#666);--faint:var(--rig-text-faint,#2a2a2a);--line:var(--rig-border,#333);--hot:var(--rig-gold,#fc4);--sel:var(--rig-blue,#4cf);--bad:var(--rig-red,#f44);--read:var(--rig-teal,#6cf);--pad:var(--rig-surface-raised,#222)}
*{box-sizing:border-box}
fieldset{min-width:0;border:0;margin:0 0 6px;padding:4px 6px}
legend{color:var(--dim);padding:0 4px}
.row{display:grid;grid-template-columns:76px 1fr 70px;gap:4px;align-items:center;margin:2px 0}
.ro{display:grid;grid-template-columns:76px 1fr;gap:4px;margin:1px 0}.ro b{font-weight:normal;color:var(--hot)}
input[type=number],select,textarea{background:var(--rig-surface,#000);color:var(--fg);border:0;font:inherit;width:100%}
input[type=range]{width:100%;margin:0;-webkit-appearance:none;appearance:none;height:16px;background:none;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;margin-top:-4px;border:0;border-radius:50%;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:var(--fg)}
input[type=range]:hover::-webkit-slider-thumb{background:var(--hot)}
input[type=range]:hover::-moz-range-thumb{background:var(--hot)}
@media (pointer:coarse){input[type=range]{height:28px}input[type=range]::-webkit-slider-thumb{width:15px;height:15px;margin-top:-7px}input[type=range]::-moz-range-thumb{width:15px;height:15px}}
button{background:var(--rig-surface,#000);color:var(--fg);border:0;font:inherit;padding:3px 6px;margin:1px}
.row button[role=switch]{min-height:36px;border:1px solid var(--line)}
.row button[aria-checked=true]{color:var(--hot);border-color:var(--hot)}
textarea{height:90px}
#notice{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);z-index:20;max-width:min(92vw,560px);padding:6px 10px;background:var(--pad);color:var(--bad);cursor:pointer}
#notice[hidden]{display:none}
/* the wave synth editor: filled surfaces and spacing to group things, no hairlines */
.wave{margin:4px 0;display:flex;flex-direction:column;gap:8px;--card:var(--rig-surface,#000)}
.wave button{background:var(--pad);border-radius:8px;padding:6px 10px;min-height:34px}
.wave button[aria-pressed=true]{color:var(--bg);background:var(--hot)}
.wave button:disabled{opacity:.3}
.wave .wave-icon{min-width:40px;padding:0}
.wave-grow{flex:1}
.wave-top{display:flex;align-items:center;gap:6px}
.wave-pname{color:var(--hot);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.wave .wave-bt{color:var(--sel);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wave .wave-bt[aria-pressed=true]{color:var(--bg);background:var(--sel)}
/* the part's own settings, folded under the synth */
.wave-part{background:var(--card);border-radius:10px;padding:0 10px}
.wave-part>summary{min-height:40px;display:flex;align-items:center;gap:6px;color:var(--dim);cursor:pointer;list-style:none}
.wave-part>summary::-webkit-details-marker{display:none}
.wave-part>summary::before{content:'▸';color:var(--fg)}.wave-part[open]>summary::before{content:'▾'}
.wave-part[open]{padding-bottom:8px}
.wave-part .midi-row{margin:4px 0}
/* sources and tabs: one bar that stays in reach while the knobs scroll */
.wave-stick{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;flex-direction:column;gap:6px;padding:4px 0 6px}
.wave-src{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.wave .wave-src button{font-size:11px;padding:0;min-height:30px;min-width:0;background:var(--card);color:var(--fg);touch-action:none;overflow:hidden;white-space:nowrap}
.wave .wave-src button[data-kind=env]{color:var(--read);order:1}.wave .wave-src button[data-kind=lfo]{color:var(--sel);order:2}
.wave .wave-src button[data-kind=vel]{order:3}.wave .wave-src button[data-kind=m]{order:4}.wave .wave-src button[data-kind=note]{order:5}.wave .wave-src button[data-kind=rand]{order:6}
.wave .wave-src .wave-pin{color:var(--hot);order:0}
.wave .wave-src button[aria-pressed=true]{color:var(--bg);background:var(--hot)}
.wave .wave-src button.dragging{background:var(--sel);color:var(--bg)}
.wave .wave-src button.driven::after{content:'⟳';margin-left:1px}
.wave:is([data-tab=MATRIX],[data-tab=PATCH]) .wave-src{display:none}
.wave-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--card);border-radius:10px;padding:3px}
.wave .wave-tabs button{flex:1 0 auto;background:none;font-size:11px;padding:0 5px;min-height:32px;color:var(--dim);border-radius:7px}
.wave .wave-tabs button[aria-pressed=true]{background:var(--pad);color:var(--hot)}
.wave-hint{color:var(--dim);font-size:12px;margin:0}
.wave-hint[data-armed]{color:var(--hot);font-size:11px}
.wave-note{color:var(--dim);font-size:11px;line-height:1.4;margin:0 2px}
/* the knobs, in cards by what they do */
.wave-body{display:flex;flex-direction:column;gap:8px}
.wave-group{background:var(--card);border-radius:10px;padding:8px}
.wave-group h4,.wave h4{margin:0 0 4px;font-weight:normal;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.wave-group .wave-row{margin-bottom:4px}
.wave-body.osc-off>.wave-group{opacity:.45}
.knobs{display:flex;flex-wrap:wrap;gap:4px}
.knob{width:62px;display:flex;flex-direction:column;align-items:center;font-size:10px;line-height:1.25;user-select:none;-webkit-user-select:none}
.knob canvas{cursor:ns-resize}
.knob span{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
.knob b{font-weight:normal;color:var(--fg);white-space:nowrap}
.knob.pinned span{color:var(--hot)}
.knob.pinned span::before{content:'◎ '}
.knob.armed canvas{background:radial-gradient(circle,rgba(255,204,68,.1),transparent 70%)}
.wave-row{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.wave-choice{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--dim)}
.wave-choice select{background:var(--pad);border-radius:8px;padding:4px 8px;min-height:34px;width:auto;color:var(--fg)}
.wave-shape,.wave-harm{display:block;background:var(--card);border-radius:10px}
.wave-macro{display:flex;flex-direction:column;align-items:center;gap:2px}
.wave-name{background:var(--pad);color:var(--fg);border:0;border-radius:8px;padding:6px 8px;font:inherit;width:100%;max-width:220px;min-height:34px}
.wave-row>.wave-name{flex:1}
.wave-macro .wave-name{width:62px;font-size:10px;padding:3px 4px;min-height:0;text-align:center}
.wave input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--pad)}
.wave input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--pad)}
.wave input[type=range]::-webkit-slider-thumb{margin-top:-5px;width:14px;height:14px}
/* the rack: a module that is off folds to its name */
.wave-fx.off .wave-fx-body{display:none}
.wave-fx.off{padding-bottom:4px}
.wave-fx-head{margin:0 0 4px}
/* the matrix: a route a card, source → knob over its depth; ⋯ opens the rest */
.wave-matrix{display:flex;flex-direction:column;gap:6px}
.wave-route{background:var(--card);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.wave-route.off{opacity:.5}
.wave-route-head{display:flex;align-items:flex-end;gap:4px}
.wave-route-head .wave-choice{flex:1 1 0;min-width:0}.wave-route-head .wave-choice select{width:100%;text-overflow:ellipsis}
.wave-arrow{color:var(--dim);padding:0 2px 9px}
.wave-route-more{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.wave-route-more[hidden]{display:none}
.wave-amt{display:flex;align-items:center;gap:8px}.wave-amt b{width:36px;text-align:right;font-weight:normal}
.wave-curve{background:var(--pad);border-radius:8px;cursor:ns-resize}
.wave .wave-add{align-self:flex-start}
.wave-lib{display:flex;flex-direction:column;gap:4px}
.wave-lib .wave-lib-name{flex:1;text-align:left}
.wave-file{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}
.wave textarea{background:var(--card);border-radius:8px;padding:6px}
.midi-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 8px}
.midi-row button{font-size:12px;padding:4px 10px;min-height:36px}
.midi-status{flex:1 1 140px;font-size:11px;color:var(--dim)}
.cam-strip{display:block;width:100%;height:72px;background:var(--rig-surface,#000);border-radius:6px;margin:4px 0 8px;touch-action:none}
.file-msg{margin:4px 0 0;color:var(--dim);font-size:11px;white-space:normal}
.wave .wave-bt{display:inline-flex;align-items:center;gap:6px}.wave .wave-bt svg{flex:none}
.wave-macro .knob>span{display:none}
/* one height for every control in a row, so a labelled choice and a button share a bottom edge on every browser */
.wave .wave-row>button,.wave .wave-row .wave-choice select,.wave .wave-route-more>button{height:40px;min-height:0;margin:0}
.wave .wave-row>.wave-name{height:40px;min-height:0}
.wave .wave-row:has(>.wave-choice){align-items:flex-start}
.wave .wave-choice>button{height:40px;min-height:0;margin:0}
/* the ball pit's palette: a keyboard whose lit keys are the notes its balls take */
.pit{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.pit-keybar{display:flex;align-items:center;gap:4px}
.pit-keys{flex:1;min-width:0;height:64px;touch-action:none}
.pit-keybar button{min-width:36px;min-height:40px;padding:0;background:var(--pad);border-radius:8px}
.pit-tools{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.pit-tools button{background:var(--pad);border-radius:8px;padding:6px 10px;min-height:34px}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:12px/1.3 var(--rig-font-mono,ui-monospace,Menlo,Consolas,monospace);
  overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#safe{position:fixed;left:0;top:0;width:0;height:0;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);pointer-events:none}
#dev{position:fixed;left:0;right:0;bottom:0;top:max(28vh,calc(env(safe-area-inset-top,0px) + 120px));z-index:10;overflow-y:auto;transition:transform .28s cubic-bezier(.16,1,.3,1);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);touch-action:pan-y;-webkit-user-select:text;user-select:text}
#scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.35)}
#dev input[type=range]{touch-action:none}
#dev[hidden],#scrim[hidden]{display:none}
#panel{max-width:440px;margin:0 auto;padding:6px}
#part-bar{position:fixed;left:var(--space-2,8px);display:flex;gap:var(--space-2,8px)}
#clip-bar{position:fixed;left:var(--space-2,8px);display:flex;gap:var(--space-2,8px)}
#copy-parts[hidden],#paste-parts[hidden]{display:none}
#history{position:fixed;left:50%;transform:translateX(-50%);display:flex;gap:var(--space-2,8px)}
#history[hidden]{display:none}
#history button:disabled{opacity:.3}
#part-bar button,#to-start,#history button,#clip-bar button,#editor-head button{min-height:44px;min-width:44px;padding:0;border:0;background:none;display:grid;place-items:center;color:var(--fg)}
#to-start{position:fixed;right:62px}
#edit-part[hidden],#delete-part[hidden],#to-start[hidden],#editor-head{display:none}
/* The sheet's top: a grab bar and, for an editor, its head. Drag it down to tuck the sheet away to just this strip,
   up or tap to bring it back; drag down again from the strip to close. */
#sheet-top{position:sticky;top:0;z-index:1;background:var(--bg);touch-action:none;cursor:grab}
#grab{height:28px;display:grid;place-items:center}
#grab::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--dim)}
#dev.min{transform:translateY(calc(100% - var(--peek,80px)));overflow:hidden}
#dev.min #grab::before{background:var(--hot)}
#dev.dragging{transition:none}
body.sheet-min #interaction{bottom:var(--peek,80px);border-bottom:1px solid var(--line)}
#dev[data-editor]:not([data-editor=""]){top:max(14vh,env(safe-area-inset-top,0px));border-radius:var(--space-3,12px) var(--space-3,12px) 0 0}
#dev[data-editor]:not([data-editor=""]) #editor-head{display:flex;align-items:center;gap:var(--space-2,8px);padding:0 var(--space-2,8px) var(--space-2,8px)}
#editor-title{flex:1;color:var(--hot)}
#dev[data-editor]:not([data-editor=""]) #panel{max-width:none;padding:var(--space-2,8px)}
#dev[data-editor]:not([data-editor=""]) button,#dev[data-editor]:not([data-editor=""]) .row,#dev[data-editor]:not([data-editor=""]) input[type=number],#dev[data-editor]:not([data-editor=""]) select{min-height:44px}
#dev[data-editor]:not([data-editor=""]) #panel>fieldset:not(#inspector),#dev[data-editor]:not([data-editor=""]) #inspector>legend{display:none}
#dev[data-editor]:not([data-editor=""]) #inspector>:is([data-k="x"],[data-k="y"],[data-k="radius"]),
#dev[data-editor="patch"] #inspector>:is([data-k="x1"],[data-k="y1"],[data-k="x2"],[data-k="y2"]),
#dev[data-editor="notes"] #inspector>:is([data-k="teeth"],[data-k="rpm"],[data-k="revs/bar"],[data-k="layer"],[data-k="phase deg"],.ro){display:none}
.roll-sel{display:flex;justify-content:flex-end;gap:var(--space-1,4px)}
#dev .roll-sel button{min-width:44px;min-height:44px;padding:0;border:0;background:none;display:grid;place-items:center;color:var(--fg)}
#dev[data-editor="notes"] #editor-title{display:none}
#editor-head .roll-sel{flex:1;min-width:0;gap:0}
#dev #editor-head button{min-width:0;flex:0 1 44px}
#dev .roll-sel .roll-snap{-webkit-appearance:none;appearance:none;width:auto;min-width:52px;margin-right:auto;padding:0 6px;border:0;background:none;color:var(--hot);font-size:15px;text-align:center}
#dev[data-editor="notes"] #inspector>button{background:var(--pad);border-radius:8px;padding:0 14px;margin:2px 4px 2px 0}
/* Pickers in the editors (voice kind, note, octave…) as compact chips that sit side by side, not full-width rows. */
#dev[data-editor]:not([data-editor=""]) #inspector>.row:has(>select){display:inline-flex;flex-direction:column;align-items:stretch;gap:2px;min-width:76px;margin:0 6px 8px 0;vertical-align:top;min-height:0}
#dev[data-editor]:not([data-editor=""]) #inspector>.row:has(>select)>span:first-child{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
#dev[data-editor]:not([data-editor=""]) #inspector>.row:has(>select)>span:empty{display:none}
#dev[data-editor]:not([data-editor=""]) #inspector>.row>select{-webkit-appearance:none;appearance:none;background:var(--pad);border-radius:8px;padding:0 12px;min-height:40px;text-align:center}
/* The disc's tuning: compact chips that wrap, a small label over each value. */
.disc-fields{display:flex;flex-wrap:wrap;gap:var(--space-2,8px);margin:var(--space-2,8px) 0}
#dev .disc-fields .row{display:flex;flex-direction:column;align-items:stretch;gap:2px;margin:0;min-height:0;flex:1 1 auto}
.disc-fields .row>span:first-child{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.disc-fields .row>span:empty{display:none}
#dev .disc-fields select,#dev .disc-fields input[type=number]{-webkit-appearance:none;appearance:none;-moz-appearance:textfield;background:var(--pad);border-radius:8px;padding:0 12px;min-height:40px;text-align:center}
.disc-fields input[type=number]::-webkit-inner-spin-button,.disc-fields input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.disc-fields .stepper{display:flex;align-items:center;gap:2px}
#dev .disc-fields .stepper input{width:48px;padding:0}
#dev .disc-fields .stepper button{min-width:40px;min-height:40px;background:var(--pad);border-radius:8px;font-size:18px}
/* the synth's patch sheet: the synth first, its part settings folded; sources and tabs stay compact (not 44 px rows) */
#dev .wave div.wave-hint:not([data-armed]){display:none}
#dev[data-editor] .wave .wave-src button{min-height:32px}
#dev[data-editor] .wave .wave-tabs button{min-height:36px}
#dev[data-editor] .wave .wave-part .row{min-height:40px}
#dev[data-editor] .wave .wave-choice>button,#dev[data-editor] .wave .wave-row>button,#dev[data-editor] .wave .wave-row .wave-choice select,#dev[data-editor] .wave .wave-route-more>button,#dev[data-editor] .wave .wave-row>.wave-name{height:44px;min-height:0;margin:0}
/* a synth row of choices (osc on, table, filter, warp, warp 2) stays one row: the choices share the width */
#dev .wave-row:has(>.wave-choice){flex-wrap:nowrap}
#dev .wave-row>.wave-choice{flex:1 1 0;min-width:0}
#dev .wave-row>.wave-choice select{width:100%;min-width:0;padding:0 4px;font-size:13px;text-overflow:ellipsis}
#dev .wave-row>button{flex:0 0 auto}
#dev .roll-sel button[aria-pressed=true]{color:var(--hot)}
#dev .roll-sel button:disabled{color:var(--faint,#555);opacity:.5}
#interaction{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:var(--space-2,8px) var(--space-3,12px) calc(env(safe-area-inset-bottom,0px) + var(--space-2,8px));background:var(--bg);border-top:1px solid var(--line);color:var(--hot);font-size:14px;text-align:center;pointer-events:none}
#interaction[hidden]{display:none}
#dev{padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--space-12,48px))}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="notice" hidden onclick="this.hidden=true"></div>
<div id="safe"></div>
<output id="interaction" hidden aria-live="polite"></output>
<div id="scrim" hidden></div>
<div id="part-bar"><button id="edit-part" hidden aria-label="Edit selected part"></button><button id="delete-part" hidden aria-label="Delete selected"></button></div>
<button id="to-start" hidden aria-label="Set to start"></button>
<div id="clip-bar"><button id="copy-parts" hidden aria-label="Copy selected"></button><button id="paste-parts" hidden aria-label="Paste"></button></div>
<div id="history"><button id="undo-all" aria-label="Undo"></button><button id="redo-all" aria-label="Redo"></button></div>
<div id="dev" hidden role="dialog" aria-label="Part controls">
  <div id="sheet-top"><div id="grab" role="button" aria-label="Tuck away or bring back the sheet"></div>
  <div id="editor-head"><span id="editor-title"></span><button id="editor-undo" aria-label="Undo"></button><button id="editor-redo" aria-label="Redo"></button><button id="editor-close" aria-label="Close"></button></div></div>
  <div id="panel"></div>
</div>
<script type="text/x-cogs-worklet" id="engine">
'use strict';
/* ---------- the reverb: a VintageVerb-style algorithmic reverb, for the room and for each synth's FX rack ---------- */
// After Sean Costello's Valhalla VintageVerb, in spirit: a predelay, an input low and high cut, an early diffuser of four
// allpasses whose blend sets the echo density from sparse to dense, a swell of two long allpasses for the Attack, a tapped
// early-reflection line, and a late ring of 4 or 6 stages (modulated allpass, allpass, delay, three-band decay) read by
// Dattorro-style output taps. Each mode is a row of lengths, taps and a modulation recipe; each color is an era:
// 1970s runs the tank at half the sample rate, band-limited to 10 kHz, with noisy modulation; 1980s is full band with the
// noisy modulation; now is full band and clean. Included in both scripts: the worklet runs Verb, the page reads the names,
// the knob list and the presets. Everything else here is prefixed so it never meets the engine's or the page's names.
const VERB_MODES=['concert hall','bright hall','plate','room','chamber','random space','chorus space','ambience','sanctuary',
  'dirty hall','dirty plate','smooth plate','smooth room','smooth random','nonlin','chaotic hall','chaotic chamber','chaotic neutral','cathedral','palace'];
const VERB_COLORS=['1970s','1980s','now'];
// [key, label, min, max, step]. Mode and color are indices into VERB_MODES and VERB_COLORS.
const VERB_DEFS=[['mode','mode',0,VERB_MODES.length-1,1],['color','color',0,VERB_COLORS.length-1,1],['wet','wet',0,1.5,.001],
  ['predelay','predelay ms',0,500,1],['decay','decay s',.2,60,.01],['size','size',0,1,.01],['attack','attack',0,1,.01],
  ['early','early diffusion',0,1,.01],['late','late diffusion',0,1,.01],['modRate','mod rate Hz',.05,10,.01],['modDepth','mod depth',0,1,.01],
  ['highCut','high cut Hz',1000,20000,10],['lowCut','low cut Hz',10,1000,1],['bassMult','bass mult',.25,4,.01],['bassXover','bass xover Hz',50,2000,1],
  ['highShelf','high shelf dB',-24,0,.1],['highFreq','high freq Hz',500,16000,10],['earlyLate','early/late',0,1,.01],['width','width',0,1.5,.01],

  const t=simT+dt*hit.f,turn=c.turns+Math.floor((c.th+c.w*dt*hit.f)/TAU);

  const midi=rd.tines?scaleNote(rd.combBase,rd.combScale,Math.min(rd.tines-1,Math.floor(hit.u*rd.tines))):ringNote(c.track,dot.ring);
  rd.hits++;rd.lastV=hit.vn;rd.lastMidi=voiceMidi(rd.voice,midi);dot.flash=rd.flash=t;
  const v=probed(rd.voice,t),key=rd.id*128+midi,hold=dot.len>1?dot.len*TAU/c.track.div/Math.abs(c.w):0;
  fire(v,t,hit.vn,hit,'cog'+c.id+'.ring'+dot.ring+'>reader'+rd.id,dot.v,

const stringLen=s=>Math.hypot(s.x2-s.x1,s.y2-s.y1);

}
function flex(arm,t,vn){arm.bendT=t;arm.bendA=Math.min(.6,vn/S.vRef*.5)*arm.flex*(arm.cog.w>0?-1:1)}

function turn(c,dt){const th=c.th+c.w*dt,k=Math.floor(th/TAU);c.th=th-k*TAU;c.turns+=k}

  if(tEnd-simT>.5){const gap=tEnd-S.lookahead-simT;for(const c of W.cogs)turn(c,gap);simT+=gap;stats.skipped+=gap}
  const pairs=[];
  for(const arm of W.arms){const c=arm.cog;if(!c.w)continue;
    for(const pad of W.pads){const h=hitWindow(c,arm,pad);if(h)pairs.push({c,arm,pad,s:h.s,edge:c.w>0?h.beta-h.half:h.beta+h.half})}}
  const plucks=[],reads=[];
  for(const arm of W.arms)if(arm.cog.w)for(const s of W.strings)if(within(arm.cog,arm.r0+arm.len,s))plucks.push([arm,s]);
  for(const c of W.cogs)if(c.track&&c.w)for(const dot of c.track.dots)for(const rd of W.readers)if(within(c,ringR(c,dot.ring),rd))reads.push([c,dot,rd]);

  const pits=W.pits.filter(p=>p.balls.length).map(pitReach);
  stats.stepsTick=0;
  while(simT<tEnd){
    const dt=Math.min(tEnd-simT,maxW?S.maxStep/maxW:Infinity,pits.length?PIT.dt:Infinity);

      const psi=p.c.th+p.arm.a,span=Math.abs(p.c.w)*dt,d0=p.c.w>0?wrap(p.edge-psi):wrap(psi-p.edge);
      if(d0>0&&d0<=span)armHit(p,simT+dt*d0/span);

    for(const[c,dot,rd]of reads)dotCross(c,dot,rd,dt);
    for(const[arm,s]of plucks)pluck(arm,s,dt);
    for(const q of pits)pitStep(q,dt,simT);
    for(const c of W.cogs)turn(c,dt);

/* ---------- audio ---------- */
let ac=null,engineNode=null,engineState='off',engineStats={},master=null,distant=null,meter=null,drumBus=null,noise=null,peak=0;
const strikes=[];
function initAudio(){
  if(ac){if(ac.state!=='running')ac.resume();return}
  // A touch device gets the larger 'playback' buffer: the smallest one underran on phones and the beat hiccuped.
  // Sound is scheduled S.lookahead ahead and drawing reads the output latency, so nothing shown lags.
  ac=new (window.AudioContext||window.webkitAudioContext)({latencyHint:matchMedia('(pointer:coarse)').matches?'playback':'interactive'});
  master=ac.createGain();master.gain.value=S.master;
  distant=ac.createBiquadFilter();distant.type='lowpass';distant.frequency.value=20000;distant.Q.value=.5;
  const lim=ac.createDynamicsCompressor();
  lim.threshold.value=-10;lim.knee.value=8;lim.ratio.value=3.5;lim.attack.value=.015;lim.release.value=.3;
  meter=ac.createAnalyser();meter.fftSize=2048;
  master.connect(distant);distant.connect(lim);lim.connect(ac.destination);lim.connect(meter);
  noise=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
  const nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  engineState='loading';
  // Chrome refuses blob: worklet modules on file:// pages; a data: URL loads there and over https.
  const url='data:text/javascript;charset=utf-8,'+encodeURIComponent($('#engine').textContent);
  ac.audioWorklet.addModule(url).then(()=>{
    // outputs past the first are the field sends, one stereo pair per field slot, into the fields node
    engineNode=new AudioWorkletNode(ac,'cogs-engine',{numberOfInputs:1,numberOfOutputs:1+FIELD_SLOTS_N,outputChannelCount:Array(1+FIELD_SLOTS_N).fill(2),
      channelCount:2,channelCountMode:'explicit',processorOptions:{voices:64,space:{...SPACE}}});
    engineNode.port.onmessage=e=>{if(e.data.type==='stats')engineStats=e.data};
    engineNode.onprocessorerror=()=>{engineState='processor error'};
    drumBus=ac.createGain();drumBus.connect(engineNode);engineNode.connect(master,0);startWave();startFields();
    engineState='ready';
  }).catch(err=>{engineState='failed: '+String(err.message).slice(0,160)});

}
function flushStrikes(){const d=new Float64Array(strikes);strikes.length=0;engineNode.port.postMessage({type:'strikes',d},[d.buffer])}

function strike(f,g,t,when,amp,pan,key,contact,attack){

// A held note rings for its length, then a damper takes it off over 60 ms.

// Every kind's way to sound: the modal synth, the wave synth, or a drum graph.
function playVoice(v,midi,when,amp,pan,key,x,hold=0,dark=0){
  if(v.kind==='synth')synth(v,midi,when,amp,pan,key,x,hold,dark);else if(v.kind==='wave')waveNote(v,midi,when,amp,pan,key,x,hold,dark);else drum(v,when,amp,pan,dark);

const voiceMidi=(v,midi)=>clamp(midi+(v.kind==='synth'||v.kind==='wave'?12*v.octave+v.semi:0),0,127);
// Additive: `partials` ringing modes at the body's ratios, bent toward harmonic, each decaying by its ratio^-damp.
function synth(v,midi,when,amp,pan,key,x,hold=0,dark=0){
  const F=BODIES[v.body],f0=hz(voiceMidi(v,midi)),f=[],g=[],t=[];let e=0;

// Drums are WebAudio graphs on the drum bus: tuned oscillators and filtered noise under one decaying gain.

/* ---------- clock ---------- */
const audioLive=()=>!!(ac&&ac.state==='running'&&engineState==='ready');
const clockBase=()=>clock.audio?ac.currentTime:performance.now()/1000;
const nowSec=()=>clockBase()+clock.shift;
function syncClock(){
  const live=audioLive();if(live===clock.audio)return;
  const before=nowSec();clock.audio=live;clock.shift=before-clockBase();
}
function setPaused(p){
  if(p===clock.paused)return;
  clock.paused=p;if(!p)clock.off=nowSec()-clock.view;
}
// Each running train turns until its motor shows angle 0; its cogs move by their ratios, so meshes hold.
function toStart(){
  // a motor already at its start (within float noise either side of 0) stays put: wrap() can read that as 2π-ε,
  // and a whole turn back would move every cog of a non-integer ratio to a different place
  const back=m=>{const a=wrap(renderTh(m));return a>TAU-1e-6?a-TAU:a};
  const by=new Map(W.cogs.filter(m=>m.motor&&m.w).map(m=>[m,-back(m)/m.w]));
  for(const c of W.cogs){const dt=by.get(c.driver);if(dt!==undefined)c.th=wrap(c.th+c.w*dt);c.turns=0}
  changed();
}

let saveTimer=0;

// Undo: one step per finished action. A step settles when the pointer lifts, or after a quiet
// spell for wheel and keyboard edits. Camera, pause, selection and cog phase are never undone.
const UNDONE_ELSEWHERE=new Set(['view','zoom','th','bx','by','bvx','bvy']);
const worldKey=()=>JSON.stringify(serialize(),(k,v)=>UNDONE_ELSEWHERE.has(k)?undefined:v);
const EDITS_MAX=500,EDITS_QUIET=350;
const edits={past:[],future:[],cur:null,pending:false,timer:0,held:false,
  snap(){return {key:worldKey(),t:simT,phase:new Map(W.cogs.map(c=>[c.id,{th:c.th,w:c.w}])),balls:ballStates()}},
  mark(){this.pending=true;clearTimeout(this.timer);this.timer=setTimeout(()=>{if(!this.held)this.commit()},EDITS_QUIET)},
  commit(){
    clearTimeout(this.timer);this.pending=false;const s=this.snap();
    if(this.cur&&s.key===this.cur.key)return;
    if(this.cur){this.past.push(this.cur);if(this.past.length>EDITS_MAX)this.past.shift();this.future.length=0}
    this.cur=s;
  },
  reset(){clearTimeout(this.timer);this.pending=false;this.past.length=0;this.future.length=0;this.cur=this.snap()},
  step(from,to){if(this.pending)this.commit();if(!from.length)return false;to.push(this.cur);this.cur=from.pop();restore(this.cur);return true},
  undo(){return this.step(this.past,this.future)},
  redo(){return this.step(this.future,this.past)},
};
// Put the parts of a snapshot back without touching the clock: each cog takes the phase it

// Balls keep moving through an undo: one still in the box carries on from where it is now; one coming back
// returns where it was when the step was taken.
const ballStates=()=>new Map(W.pits.flatMap(p=>p.balls.map(b=>[p.id+':'+b.id,{bx:b.x,by:b.y,bvx:b.vx,bvy:b.vy,trail:b.trail}])));

  for(const c of j.cogs){const p=s.phase.get(c.id);c.th=wrap(p.th+p.w*(simT-s.t))}
  const live=ballStates();
  for(const p of j.pits||[])for(const b of p.balls){const k=p.id+':'+b.id,st=live.get(k)||s.balls?.get(k);if(st)Object.assign(b,st)}
  reload(j);

// Every part is built and checked before any of the live world is replaced.
function deserialize(j){

    // a wave voice saved whole, or named by a factory preset (the demo's readers)
    if(v.kind==='wave'){const keep={};for(const k of WAVE_VOICE_KEYS)if(v[k]!==undefined)keep[k]=v[k];return waveVoice(!v.osc&&WAVE_PRESETS[v.preset]?WAVE_PRESETS[v.preset]():v,keep)}

    belts:j.belts.map(b=>({...b,a:cog(b.a,'belt '+b.id),b:cog(b.b,'belt '+b.id)})),
    strings:j.strings.map(s=>({...s,hits:0,lastV:0})),
    pads:j.pads.map(p=>({...p,voice:importedVoice(p),hits:0,lastV:0})),
    readers:j.readers.map(r=>({tines:0,combBase:60,combScale:'major',...r,on:null,voice:importedVoice(r),hits:0,lastV:0}))};

  next.cams=(j.cams||[]).filter(m=>byId.has(m.cog)).map(m=>{const o={...newCam(m.id),...m,cog:byId.get(m.cog),ver:0};
    o.prof=Array.isArray(m.prof)&&m.prof.length===CAM_N?m.prof.map(x=>clamp(+x||0,0,1)):camShape(CAM_SHAPES[m.shape]?m.shape:'sine');

  for(const[i,r]of next.readers.entries()){

  const bpm=S.bpm||120;if(bpm!==waveBpm){waveBpm=bpm;waveNode.port.postMessage({type:'tempo',bpm})}

// Opens a cogs file, a bare machine (the old json export) or one synth patch (into the library). The machine is

    if(n)bits.push(`${pl(n)} added`+(got.renamed?` (${got.renamed} renamed beside one of the same name)`:''));

}
const dotSectors=d=>[numSector('odds','probability',d,'p',0,1,.01),numSector('level','velocity',d,'v',0,1,.01),numSector('div','length steps',d,'len',1,ui.dotOf.track.div,1)];
const ROOM_ICON={mode:'verb',color:'era',wet:'wet',size:'size',decay:'tail',highCut:'air',shimmer:'shimmer'};

function roomSectors(){

    :defSector(ROOM_ICON[k],SPACE,SPACE_DEFS.find(d=>d[0]===k),roomEdited));
  out.push(choiceSector('freeze','reverb freeze',[0,1],()=>SPACE.freeze,x=>{SPACE.freeze=x;roomEdited()},onOff));
  out.push(defSector('level',S,S_DEFS.find(d=>d[0]==='master'),roomEdited));

  out.push(numSector('tempo','tempo bpm',S,'bpm',0,300,1,()=>changed(true)),numSector('beats','beats/bar',S,'beats',1,16,1,()=>changed(true)));

}
async function share(){
  ui.sealAt=performance.now();

const norm=p=>p.log?Math.log(p.get()/p.min)/Math.log(p.max/p.min):(p.get()-p.min)/(p.max-p.min);
const stepsOf=p=>!p.options&&!p.action&&p.step>=1&&(p.max-p.min)/p.step<=120?(p.max-p.min)/p.step:0;
function setNorm(p,n){n=clamp(n,0,1);const x=p.log?p.min*Math.pow(p.max/p.min,n):p.min+(p.max-p.min)*n;p.set(clamp(+(Math.round(x/p.step)*p.step).toFixed(6),p.min,p.max))}
function stepChoice(p,d,from=p.get()){const n=p.options.length,i=p.options.indexOf(from);p.set(p.options[((i+d)%n+n)%n])}
function activeBezel(){
  if(ui.carry)return null;
  let b=null;const o=sel&&sel.o,ring=(at,size,sectors)=>{const c=toScreen(at);return {cx:c.x,cy:c.y,R:clamp(size+46,92,132),sectors,owner:o}};
  if(!sel){if(ui.room)b={cx:CW/2,cy:(safeTop+shelfTop())/2,R:Math.min(CW,shelfTop()-safeTop)/2-44,sectors:roomSectors(),owner:SPACE}}
  else if(sel.type==='pad')b=ring(o,o.r*S.zoom,voiceSectors(o,true));
  else if(sel.type==='reader')b=ring(mid(o),stringLen(o)*S.zoom/2,readerSectors(o));
  else if(sel.type==='cam')b=ring(camTip(o),0,camSectors(o));
  else if(sel.type==='probe'){if(probeAlive(o))b=ring(probePoint(o),0,probeSectors(o))}
  else if(sel.type==='field')b=ring(o,0,fieldSectors(o));
  else if(sel.type==='string')b=ring(mid(o),stringLen(o)*S.zoom/2,stringSectors(o));
  else if(sel.type==='dot')b=ring(ui.dotAt,0,dotSectors(o));
  else if(sel.type==='cog'&&o.track){
    // A disc zoomed into a score takes taps on its face as pins; its tuning is then in the notes sheet.
    // Otherwise a disc larger than the screen allows gets its bezel over its face at the largest ring that fits.
    const R=Math.min(Math.max(92,radius(o)*S.zoom+40),Math.min(CW,shelfTop()-safeTop)/2-BEZEL_W-8),c=toScreen(o);
    if(!noteMode(o))b={cx:c.x,cy:c.y,R,sectors:trackSectors(o),owner:o};
  }
  if(!b){ui.bezelOwner=null;return null}
  if(ui.bezelOwner!==b.owner){ui.bezelOwner=b.owner;ui.bezelAt=performance.now()}
  return b;
}
const BEZEL_W=19,DRAG_PX=240,OPTION_PX=32;
function drawBezel(b){
  const n=b.sectors.length,span=TAU/n,k=clamp((performance.now()-ui.bezelAt)/160,0,1),e=1-Math.pow(1-k,4),R=b.R*(.7+.3*e);
  cx.save();cx.globalAlpha=e;
  b.sectors.forEach((p,i)=>{
    const a0=-Math.PI/2+i*span+.025,a1=a0+span-.05,am=(a0+a1)/2,active=ui.sector===i&&ui.bezelOwner===b.owner;
    cx.beginPath();cx.arc(b.cx,b.cy,R+BEZEL_W,a0,a1);cx.arc(b.cx,b.cy,R-BEZEL_W,a1,a0,true);cx.closePath();
    cx.fillStyle=active?PAD:BG;cx.fill();cx.strokeStyle=FAINT;cx.lineWidth=1;cx.stroke();
    const rv=R+BEZEL_W-5;let ink=p.toggle?(p.get()?HOT:DIM):active?HOT:FG;
    if(p.action){const age=performance.now()-(ui.sealAt||-1e9);if(age<900)ink=ui.sealOk?HOT:BAD}
    else if(p.options){
      const m=p.options.length,cur=p.options.indexOf(p.get());
      for(let j=0;j<m;j++){const a=a0+.12+(a1-a0-.24)*(m===1?.5:j/(m-1));cx.fillStyle=j===cur?HOT:DIM;circle(b.cx+Math.cos(a)*rv,b.cy+Math.sin(a)*rv,j===cur?2.6:1.5,true)}
    }else{
      const v=clamp(norm(p),0,1),ae=a0+.08+(a1-a0-.16)*v;
      cx.lineCap='round';cx.lineWidth=1;cx.strokeStyle=DIM;cx.beginPath();cx.arc(b.cx,b.cy,rv,a0+.08,a1-.08);cx.stroke();
      cx.lineWidth=2;cx.strokeStyle=FG;cx.beginPath();cx.arc(b.cx,b.cy,rv,a0+.08,Math.max(a0+.081,ae));cx.stroke();cx.lineCap='butt';
      cx.fillStyle=HOT;circle(b.cx+Math.cos(ae)*rv,b.cy+Math.sin(ae)*rv,2.6,true);
    }
    const ix=b.cx+Math.cos(am)*(R-4),iy=b.cy+Math.sin(am)*(R-4);
    if(p.icon==='kind'){cx.strokeStyle=ink;cx.lineWidth=1.2;circle(ix,iy,8);emblem(p.get(),ix,iy,8)}
    else if(p.icon==='fxmode'){cx.strokeStyle=ink;cx.lineWidth=1.2;circle(ix,iy,8);const z=PX;PX=1;fieldGlyph(p.get(),ix,iy,5);PX=z}
    else{cx.save();cx.translate(ix-9,iy-9);cx.scale(.75,.75);cx.strokeStyle=ink;cx.lineWidth=1.8;cx.lineJoin=cx.lineCap='round';cx.stroke(iconPath(p.icon));cx.restore()}
  });
  cx.restore();
}
function bezelHit(b,s){
  const d=Math.hypot(s.x-b.cx,s.y-b.cy);if(Math.abs(d-b.R)>BEZEL_W+6)return -1;
  return Math.floor(wrap(Math.atan2(s.y-b.cy,s.x-b.cx)+Math.PI/2)/(TAU/b.sectors.length));
}
