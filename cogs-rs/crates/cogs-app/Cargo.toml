[package]
name = "cogs-app"
edition.workspace = true
version.workspace = true

[lib]
name = "cogs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["gui"]
# the screen: the stage and the app around it (off for the web's audio worklet, which only plays)
gui = ["dep:egui", "dep:eframe", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]

[dependencies]
cogs-dsp = { path = "../cogs-dsp" }
cogs-sim = { path = "../cogs-sim" }
rtrb = "0.3"
log = "0.4"
egui = { version = "0.37", default-features = false, features = ["default_fonts"], optional = true }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }

# the web: the app in a canvas, its sound in an AudioWorklet running cogs-worklet (web/README.md)
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"], optional = true }
wasm-bindgen = { version = "0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "HtmlCanvasElement", "Element", "console"] }

[dev-dependencies]
egui_glow = "0.37"
glow = "0.17"
khronos-egl = { version = "6", features = ["static"] }
png = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "android-native-activity"], optional = true }
ndk = { version = "0.9", features = ["audio", "api-level-26"] }
jni = "0.21"
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.15"
