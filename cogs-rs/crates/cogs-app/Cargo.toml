[package]
name = "cogs-app"
edition.workspace = true
version.workspace = true

[lib]
name = "cogs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cogs-dsp = { path = "../cogs-dsp" }
cogs-sim = { path = "../cogs-sim" }
rtrb = "0.3"
log = "0.4"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[dev-dependencies]
egui_glow = "0.37"
glow = "0.17"
khronos-egl = { version = "6", features = ["static"] }
png = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
ndk = { version = "0.9", features = ["audio", "api-level-26"] }
jni = "0.21"
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.15"
