[workspace]
resolver = "2"
members = ["crates/cogs-dsp", "crates/cogs-sim", "crates/cogs-app", "crates/cogs-worklet"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 4
panic = "abort"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
