[workspace]
resolver = "2"
members = ["crates/cogs-dsp", "crates/cogs-sim", "crates/cogs-app", "crates/cogs-worklet"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 4
panic = "abort"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# The web app's wasm (web/build.sh): small over fast; the worklet's sound stays on release.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
